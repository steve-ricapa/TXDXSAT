# ---------------------------------------------------------------------------
# TXDXSAT frontend — Nginx (production)
#
# Serves the SPA under the public prefix /sat and reverse-proxies:
#   /sat/api/*       -> backend:4000/api/*        (HTTP)
#   /sat/socket.io/* -> backend:4000/socket.io/*  (WebSocket upgrade)
# ---------------------------------------------------------------------------

# WebSocket connection upgrade handling.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10m;
  server_tokens off;
  # Keep redirects relative so they do not leak/lose the public port.
  absolute_redirect off;

  # --- Security headers ----------------------------------------------------
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # --- Compression ---------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/javascript application/javascript
    application/json application/xml image/svg+xml;

  # --- Liveness probe ------------------------------------------------------
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # --- Root redirect to the public prefix ----------------------------------
  location = / {
    return 301 /sat/;
  }
  location = /sat {
    return 301 /sat/;
  }

  # --- Immutable, hashed build assets --------------------------------------
  location /sat/assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # --- Backend API ---------------------------------------------------------
  # Strips the /sat prefix: /sat/api/v1/health -> /api/v1/health
  location /sat/api/ {
    proxy_pass http://backend:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }

  # --- Socket.IO (WebSocket + polling) -------------------------------------
  location /sat/socket.io/ {
    proxy_pass http://backend:4000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # --- SPA fallback --------------------------------------------------------
  location /sat/ {
    try_files $uri $uri/ /sat/index.html;
  }

  # Everything else is not part of the application.
  location / {
    return 404;
  }
}
